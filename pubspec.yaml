name: medisense
description: "MediSense - OCR-Powered Voice-Based Medication Scheduling"
publish_to: "none"

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.8.1
  provider: ^6.1.5
  google_fonts: ^6.1.0
  sqflite: ^2.3.3+1
  path: ^1.9.0
  intl: ^0.19.0
  uuid: ^4.4.0
  flutter_local_notifications: ^17.2.1+2
  flutter_tts: ^4.1.0
  timezone: ^0.9.4
  permission_handler: ^11.3.1
  path_provider: ^2.1.3
  camera: ^0.12.0+1
  # Local Camera2 fork keeps CONTROL_AF_MODE_CONTINUOUS_PICTURE during still
  # capture instead of forcing a one-shot AF lock on every scan.
  camera_android:
    path: third_party/camera_android
  camera_platform_interface: 2.13.0
  mobile_scanner: ^7.4.0
  image: ^3.3.0
  google_mlkit_text_recognition: ^0.17.1
  shared_preferences: ^2.3.4
  connectivity_plus: ^6.1.1
  http: ^1.2.2
  archive: ^3.6.1
  pointycastle: ^4.0.0
  flutter_timezone: ^5.1.0
  google_sign_in: ^7.2.0
  supabase_flutter: ^2.17.2
  url_launcher: ^6.3.2
  # Android-only offline ASR. The Vosk model is downloaded to application
  # documents on first use and reused without network access afterward.
  # pub.dev's 0.3.48 archive has stale http/permission_handler constraints.
  # Pin the compatible official revision rather than weakening app packages.
  vosk_flutter:
    git:
      url: https://github.com/alphacep/vosk-flutter.git
      ref: e655a96f0ce0dadb5ea8900aa1ba23260c3ec904
  app_links: ^7.2.1
  sqflite_common_ffi: 2.4.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/app_icon.png
    - assets/data/ph_fda_drug_catalog.json.gz
    - assets/data/us_fda_ndc.csv
    - assets/initial_meds.db

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
