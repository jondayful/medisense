# Builds an unsigned iPhone IPA for local signing on Windows. This does not
# upload to TestFlight or make an IPA that iOS can install without signing.
# iOS Firebase configuration is optional for this free-account test build.
workflows:
  ios-unsigned-sideload:
    name: MediSense iOS unsigned IPA (Windows sideload)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      groups:
        - medisense_ios
      flutter: stable
      xcode: latest
    scripts:
      - name: Prepare private app configuration
        script: |
          python3 - <<'PY'
          import json
          import base64
          import os
          import pathlib
          import plistlib
          import re

          required = (
              'SUPABASE_URL',
              'SUPABASE_ANON_KEY',
              'CLOUD_VISION_API_KEY_IOS',
              'IOS_GOOGLE_CLIENT_ID',
          )
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing Codemagic medisense_ios variables: ' + ', '.join(missing))

          client_id = os.environ['IOS_GOOGLE_CLIENT_ID']
          match = re.fullmatch(r'([A-Za-z0-9-]+)\.apps\.googleusercontent\.com', client_id)
          if not match:
              raise SystemExit('IOS_GOOGLE_CLIENT_ID has an invalid iOS OAuth client ID format')

          build_dir = pathlib.Path(os.environ['CM_BUILD_DIR'])
          defines = {
              'SUPABASE_URL': os.environ['SUPABASE_URL'],
              'SUPABASE_ANON_KEY': os.environ['SUPABASE_ANON_KEY'],
              'CLOUD_VISION_API_KEY_IOS': os.environ['CLOUD_VISION_API_KEY_IOS'],
          }
          (build_dir / 'cloud_vision.defines.json').write_text(json.dumps(defines), encoding='utf-8')
          google_config = build_dir / 'ios' / 'Flutter' / 'GoogleSignIn.xcconfig'
          google_config.write_text(
              'IOS_GOOGLE_CLIENT_ID = ' + client_id + '\n'
              'IOS_GOOGLE_URL_SCHEME = com.googleusercontent.apps.' + match.group(1) + '\n',
              encoding='utf-8',
          )
          if os.environ.get('IOS_FIREBASE_CONFIG_BASE64'):
              encoded_firebase = ''.join(os.environ['IOS_FIREBASE_CONFIG_BASE64'].split())
              contents = base64.b64decode(encoded_firebase, validate=True)
              plist = plistlib.loads(contents)
              if plist.get('BUNDLE_ID') != 'com.matech.medisense':
                  raise SystemExit('Firebase iOS bundle ID does not match MediSense')
              (build_dir / 'ios' / 'Runner' / 'GoogleService-Info.plist').write_bytes(contents)
              print('iOS Firebase push configuration prepared')
          else:
              print('iOS Firebase push configuration skipped for unsigned build')
          print('iOS build configuration prepared')
          PY
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods
        script: cd ios && pod install
      - name: Analyze Dart code
        script: flutter analyze
      - name: Build iPhone app without Apple signing
        script: |
          flutter build ios --release --no-codesign \
            --dart-define-from-file="$CM_BUILD_DIR/cloud_vision.defines.json"
      - name: Package unsigned IPA for local signing
        script: |
          mkdir -p build/ios/sideload/Payload
          ditto build/ios/iphoneos/Runner.app build/ios/sideload/Payload/Runner.app
          cd build/ios/sideload
          ditto -c -k --sequesterRsrc --keepParent Payload MediSense-unsigned.ipa
    artifacts:
      - build/ios/sideload/MediSense-unsigned.ipa
